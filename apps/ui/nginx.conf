# OPTIO Operational Console — production Nginx server block.
#
# Rendered at container start by the official nginx image's envsubst hook
# (/etc/nginx/templates/default.conf.template -> /etc/nginx/conf.d/default.conf).
# Only ${UPPER_CASE} variables that exist in the environment are substituted;
# nginx runtime variables ($uri, $host, ...) are left untouched.
#
#   PIPELINE_UPSTREAM  Base URL of the pipeline HTTP daemon   (default http://optio-pipeline:3000)
#   NGINX_RESOLVER     DNS resolver used for the upstream host (default 127.0.0.11 = Docker embedded DNS)

server {
    listen 4000;
    listen [::]:4000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # Resolve the upstream lazily per request so the console boots and stays up even while the
    # pipeline container is restarting ("kill it twice" — the UI must never crash-loop on a
    # missing dependency). A static hostname in proxy_pass would fail nginx startup instead.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $pipeline_upstream "${PIPELINE_UPSTREAM}";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # --- Pipeline control & observability API -------------------------------------------
    location /api/ {
        proxy_pass $pipeline_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # retry-all / mutation bursts can legitimately run long; the client enforces its own timeouts.
        proxy_read_timeout 90s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @pipeline_unreachable;
    }

    location = /health {
        proxy_pass $pipeline_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @pipeline_unreachable;
    }

    # Deterministic JSON error so the UI client surfaces a clear "OFFLINE" reason instead of an HTML page.
    location @pipeline_unreachable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"pipeline upstream unreachable","upstream":"${PIPELINE_UPSTREAM}"}';
    }

    # --- Static bundle -------------------------------------------------------------------
    # Vite emits content-hashed assets: cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA entry point: never cache index.html so deploys roll out immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
