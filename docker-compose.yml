networks:
  optio-network:
    name: optio-network
    driver: bridge

volumes:
  postgres_data:
    name: optio_postgres_data
  elasticsearch_data:
    name: optio_elasticsearch_data
  rabbitmq_data:
    name: optio_rabbitmq_data

services:
  postgres:
    image: postgres:16-alpine
    container_name: optio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optio_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-optio_replication}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optio} -d ${POSTGRES_DB:-optio_replication}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - optio-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: optio-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq 'red'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - optio-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: optio-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-optio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-optio_secure_pass}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - optio-network

  pipeline:
    build:
      context: .
      dockerfile: apps/pipeline/Dockerfile
    container_name: optio-pipeline
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://optio:optio_secure_pass@postgres:5432/optio_replication
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - RABBITMQ_URL=amqp://optio:optio_secure_pass@rabbitmq:5672
      - PIPELINE_PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - optio-network

  consumer:
    build:
      context: .
      dockerfile: apps/consumer/Dockerfile
    container_name: optio-consumer
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - RABBITMQ_URL=amqp://optio:optio_secure_pass@rabbitmq:5672
      - CONSUMER_PORT=3001
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - optio-network

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    container_name: optio-ui
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PIPELINE_UPSTREAM=http://pipeline:3000
    depends_on:
      pipeline:
        condition: service_started
    networks:
      - optio-network
